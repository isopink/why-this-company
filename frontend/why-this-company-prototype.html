<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>why this company?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">

  <!-- ========== 1 ========== -->
  <section class="screen on" id="s1">
    <button class="hero-title" data-go="s2" aria-label="시작하기">
      <span class="hero-title__line">Why<mark>this</mark></span>
      <span class="hero-title__line">company?</span>
    </button>
  </section>

  <!-- ========== 2 ========== -->
  <section class="screen" id="s2">
    <div class="wrap" style="max-width:none">
      <div class="map-head">
        <h2 id="mapTitle">지원할 직무를 고르세요</h2>
        <span id="mapSub">이어진 회사가 그 직무를 뽑습니다</span>
      </div>
      <div class="graph"><svg id="gsvg" preserveAspectRatio="xMidYMid meet"></svg></div>
      <button class="map-back fade" id="mapBack">다른 직무 고르기</button>
    </div>
  </section>

  <!-- ========== 3 ========== -->
  <section class="screen" id="s3">
    <div class="wrap">
      <p class="pick" id="pickLine"></p>
      <h2 class="title-role">몇 가지 질문을 드리겠습니다</h2>
      <p class="lead">공시에서 찾은 사실마다 질문을 하나씩 드립니다. 답을 적으면 지원동기 초안이 되고,<br>같은 답이 면접에서 그대로 쓰입니다.</p>
      <ol>
        <li>질문 아래에는 그 질문이 나온 숫자와 원문 위치가 붙어 있습니다.</li>
        <li>답은 저장되지 않습니다. 다 쓰면 파일로 내려받으세요.</li>
        <li>모범답안은 드리지 않습니다. 고르고 쓰는 건 본인 몫입니다.</li>
      </ol>
      <div class="load" id="load"><i></i></div>
      <div class="load-label" id="loadLabel"></div>
      <button class="btn fade" id="goQ">질문 받기</button>
    </div>
  </section>

  <!-- ========== 4 ========== -->
  <section class="screen" id="s4">
    <div class="progress"><i id="bar"></i></div>
    <div class="qwrap">
      <div class="qtop">
        <span id="qMeta"></span>
        <span class="count" id="qCount"></span>
      </div>
      <div id="stage4"></div>
    </div>
  </section>

</div>

<script>
/* ---------------- data ---------------- */
const JOBS = [
  {id:"proc", name:"공정·생산", cos:["삼성바이오로직스","삼성전자","SK하이닉스","LG에너지솔루션","농심"]},
  {id:"rnd",  name:"R&D",      cos:["삼성바이오로직스","SK하이닉스","LG에너지솔루션","아모레퍼시픽","한화에어로스페이스"]},
  {id:"plan", name:"기획·전략", cos:["삼성바이오로직스","현대자동차","NAVER","카카오","농심"]},
  {id:"dev",  name:"개발\n(SW·데이터)", cos:["삼성바이오로직스","NAVER","카카오","삼성전자","현대자동차"]},
  {id:"sales",name:"영업·마케팅",cos:["삼성바이오로직스","아모레퍼시픽","농심","현대자동차","카카오"]},
  {id:"fin",  name:"재무·구매\n(SCM)", cos:["삼성바이오로직스","삼성전자","현대자동차","한화에어로스페이스","HL만도"]}
];

/* 매핑 테이블 [유형 × 직무계열] 골격을 질문으로 구체화한 것 */
const Q = {
  proc:[
    "지역별 매출에서 유럽과 미국이 합쳐 90%인데, 규제 요구가 서로 다른 두 시장에 맞춰 공정을 어떻게 표준화해야 할까요?",
    "주요 매입처가 소수로 지정된 상황에서, 원재료 편차를 공정 조건으로 흡수하려면 무엇부터 봐야 할까요?",
    "미국 비중이 23.5%에서 38.0%로 오른 만큼 증설이 따라와야 하는데, 초기 가동 수율은 어떻게 잡아야 할까요?"
  ],
  rnd:[
    "지역별 매출에서 유럽과 미국이 합쳐 90%인데, 다른 시장을 겨냥한 기술 다변화는 어디서 출발해야 할까요?",
    "주요 매입처가 소수로 지정돼 있습니다. 대체 소재나 내재화 연구로 풀 수 있는 지점은 어디일까요?",
    "미국 비중이 23.5%에서 38.0%로 늘어난 제품군이라면, 차세대 버전 개발에서 무엇이 먼저 필요할까요?"
  ],
  plan:[
    "지역별 매출에서 유럽과 미국이 합쳐 90%입니다. 신규 시장 진입을 검토한다면 어떤 지역부터 보시겠어요?",
    "주요 매입처가 소수로 지정된 구조에서, 공급망 다변화 시나리오는 어떤 축으로 짜야 할까요?",
    "미국 비중이 23.5%에서 38.0%로 올랐습니다. 이 속도를 전제로 생산능력을 어떻게 추정하시겠어요?"
  ],
  dev:[
    "지역별 매출에서 유럽과 미국이 합쳐 90%인데, 지역마다 다른 규격·인증 데이터를 어떻게 관리해야 할까요?",
    "주요 매입처가 소수로 지정돼 있습니다. 수급 상황을 조기에 감지하려면 무엇을 데이터로 잡아야 할까요?",
    "미국 비중이 23.5%에서 38.0%로 늘었습니다. 늘어난 물량을 감당할 인프라에서 첫 병목은 어디일까요?"
  ],
  sales:[
    "지역별 매출에서 유럽과 미국이 합쳐 90%이고 국내는 16.0%에서 8.2%로 줄었습니다. 어느 고객군을 새로 열어야 할까요?",
    "주요 매입처가 소수로 지정된 산업입니다. 신규 고객을 찾으려면 어떤 시장 조사가 먼저일까요?",
    "미국 비중이 23.5%에서 38.0%로 올랐습니다. 그 시장에서 영업망을 넓힌다면 무엇부터 하시겠어요?"
  ],
  fin:[
    "지역별 매출에서 유럽과 미국이 합쳐 90%입니다. 환위험과 지역별 매출채권 리스크를 어떻게 나눠 보시겠어요?",
    "주요 매입처가 소수로 지정돼 있습니다. 매입 조건과 단가를 비교하려면 어떤 기준이 필요할까요?",
    "미국 비중이 23.5%에서 38.0%로 오르며 증설 투자가 따라옵니다. 집행을 어떻게 모니터링해야 할까요?"
  ]
};

const EV = [
  {tag:"주목 1. 매출이 특정 지역에 쏠림", val:"유럽, 미국 = 90%", basis:"상위 1-2개 합 90% ≥ 70%",
   src:"II. 사업의 내용 > 4. 매출 및 수주상황", map:"[편중 × 계열]",
   follow:"이 숫자는 어디서 확인하셨나요?"},
  {tag:"주목 2. 원재료를 소수 거래처에 의존", val:"주요 매입처 소수 지정: Global Life Sciences, 머크, 싸토리우스", basis:"매입처 소수 지정 명시 (K-IFRS 1108호 주요고객 공시 취지 참조)",
   src:"II. 사업의 내용 > 3. 원재료 및 생산설비", map:"[의존 × 계열]",
   follow:"그 수치를 왜 소수 거래처 의존으로 봤나요? 기준이 무엇이었나요?"},
  {tag:"주목 3. 특정 항목 비중이 급격히 확대", val:"미국 비중 23.5% → 38.0% (+14.5%p)", basis:"전년 대비 10%p 이상 변동",
   src:"II. 사업의 내용 > 4. 매출 및 수주상황", map:"[급변(확대) × 계열]",
   follow:"그 사항을 이 직무에서 다루려면 무엇부터 해야 한다고 보나요?"}
];

const COMMON = [
  {q:"많은 회사 중 왜 삼성바이오로직스인가요?", f:"같은 기준에 맞는 다른 회사도 있을 텐데, 그중 삼성바이오로직스여야 하는 이유는 무엇인가요?"},
  {q:"입사하면 가장 먼저 해보고 싶은 일은 무엇인가요?", f:"그 일을 하려면 지금 어떤 준비가 더 필요하다고 보나요?"}
];

const LOAD_STEPS = ["공시를 모으는 중","주목할 사항을 판정하는 중","숫자를 원본과 대조하는 중","질문을 만드는 중"];

/* ---------------- state ---------------- */
let picked = {job:null, co:null};
const $ = s => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- screens ---------------- */
function go(id){
  const cur = document.querySelector(".screen.on");
  if(cur && cur.id === id) return;
  if(cur) cur.classList.remove("on");
  setTimeout(()=>{
    const next = document.getElementById(id);
    next.classList.add("on");
    next.scrollTop = 0;
    if(id === "s2") resetMap();
    if(id === "s3") runLoad();
  }, reduce ? 10 : 420);
}
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));

/* ---------------- graph (fixed layout) ---------------- */
const SVG = "http://www.w3.org/2000/svg";
const gsvg = document.getElementById("gsvg");
let sel = null;

/* companies -> which job families hire them */
const CO = (()=>{
  const m = new Map();
  JOBS.forEach(j=>j.cos.forEach(c=>{
    if(!m.has(c)) m.set(c, []);
    m.get(c).push(j.id);
  }));
  return [...m].map(([name,jobs])=>({name,jobs}));
})();

function profile(){
  const narrow = window.innerWidth < 760;
  return narrow
    ? {w:760, h:1020, cx:380, cy:510, jr:150, co1:275, co2:330, fj:19, fc:17}
    : {w:1000, h:680, cx:500, cy:340, jr:150, co1:245, co2:290, fj:17, fc:15};
}

function drawGraph(){
  const P = profile();
  gsvg.setAttribute("viewBox", `0 0 ${P.w} ${P.h}`);
  gsvg.innerHTML = "";

  /* job ring — fixed, evenly spaced from 12 o'clock */
  const jobPos = {};
  JOBS.forEach((j,i)=>{
    const a = -Math.PI/2 + i*(Math.PI*2/JOBS.length);
    jobPos[j.id] = {x:P.cx + Math.cos(a)*P.jr, y:P.cy + Math.sin(a)*P.jr, a};
  });

  /* company ring — ordered by the average angle of the jobs they connect to,
     then spaced evenly so labels never collide */
  const withPref = CO.map(c=>{
    let sx=0, sy=0;
    c.jobs.forEach(id=>{ sx += Math.cos(jobPos[id].a); sy += Math.sin(jobPos[id].a); });
    let a = Math.atan2(sy, sx);
    if(a < -Math.PI/2) a += Math.PI*2;
    return {...c, pref:a};
  }).sort((m,n)=>m.pref-n.pref);

  const coPos = {};
  withPref.forEach((c,i)=>{
    const a = -Math.PI/2 + i*(Math.PI*2/withPref.length);
    const r = (i % 2 === 0) ? P.co1 : P.co2;
    coPos[c.name] = {x:P.cx + Math.cos(a)*r, y:P.cy + Math.sin(a)*r};
  });

  /* links first so nodes sit on top */
  const gl = document.createElementNS(SVG,"g");
  gsvg.appendChild(gl);
  const links = [];
  JOBS.forEach(j=>j.cos.forEach(name=>{
    const ln = document.createElementNS(SVG,"line");
    const a = jobPos[j.id], b = coPos[name];
    ln.setAttribute("x1",a.x); ln.setAttribute("y1",a.y);
    ln.setAttribute("x2",b.x); ln.setAttribute("y2",b.y);
    ln.setAttribute("class","lnk");
    gl.appendChild(ln);
    links.push({el:ln, job:j.id, co:name});
  }));

  const nodes = [];
  function node(kind, x, y, r, label, fs, data){
    const g = document.createElementNS(SVG,"g");
    g.setAttribute("class","nd "+kind);
    const c = document.createElementNS(SVG,"circle");
    c.setAttribute("cx",x); c.setAttribute("cy",y); c.setAttribute("r",r);
    const t = document.createElementNS(SVG,"text");
    t.setAttribute("x",x); t.setAttribute("y", y + r + fs + 5);
    t.setAttribute("font-size",fs);
    t.textContent = label;
    g.appendChild(c); g.appendChild(t);
    gsvg.appendChild(g);
    nodes.push({el:g, ...data});
    return g;
  }

  JOBS.forEach(j=>{
    const p = jobPos[j.id];
    const g = node("job", p.x, p.y, 24 + j.cos.length*1.4,
                   j.name.replace("\n"," "), P.fj, {kind:"job", id:j.id});
    g.addEventListener("click", ()=>pickJob(j));
  });
  withPref.forEach(c=>{
    const p = coPos[c.name];
    const g = node("co", p.x, p.y, 9 + c.jobs.length*3.6, c.name, P.fc,
                   {kind:"co", id:c.name, jobs:c.jobs});
    g.addEventListener("click", ()=>{
      if(sel && c.jobs.includes(sel)) pickCo(c.name);
      else pickJob(JOBS.find(j=>j.id === c.jobs[0]));
    });
  });

  gsvg._links = links;
  gsvg._nodes = nodes;
  if(sel) applySel(); else clearSel();
}

function applySel(){
  gsvg._nodes.forEach(n=>{
    n.el.classList.remove("dim","sel","near");
    if(n.kind === "job") n.el.classList.add(n.id === sel ? "sel" : "dim");
    else n.el.classList.add(n.jobs.includes(sel) ? "near" : "dim");
  });
  gsvg._links.forEach(l=>{
    l.el.classList.toggle("hot", l.job === sel);
    l.el.classList.toggle("off", l.job !== sel);
  });
}
function clearSel(){
  gsvg._nodes.forEach(n=>n.el.classList.remove("dim","sel","near"));
  gsvg._links.forEach(l=>l.el.classList.remove("hot","off"));
}

function pickJob(job){
  sel = job.id;
  picked.job = job;
  document.getElementById("mapTitle").textContent = job.name.replace("\n"," ") + " 직무를 뽑는 회사";
  document.getElementById("mapSub").textContent = "분석할 회사를 고르세요";
  document.getElementById("mapBack").classList.add("in");
  applySel();
}
function resetMap(){
  sel = null; picked = {job:null, co:null};
  document.getElementById("mapTitle").textContent = "지원할 직무를 고르세요";
  document.getElementById("mapSub").textContent = "이어진 회사가 그 직무를 뽑습니다";
  document.getElementById("mapBack").classList.remove("in");
  clearSel();
}
document.getElementById("mapBack").addEventListener("click", resetMap);

function pickCo(name){
  picked.co = name;
  gsvg._nodes.forEach(n=>{ if(n.kind === "co" && n.id !== name) n.el.classList.add("dim"); });
  setTimeout(()=>go("s3"), reduce?10:340);
}

let lastNarrow = window.innerWidth < 760;
addEventListener("resize", ()=>{
  const now = window.innerWidth < 760;
  if(now !== lastNarrow){ lastNarrow = now; drawGraph(); }
});
drawGraph();

/* ---------------- interstitial ---------------- */
function runLoad(){
  const jobName = picked.job ? picked.job.name.replace("\n"," ") : "";
  $("#pickLine").innerHTML = `<b>${picked.co}</b> · ${jobName}`;
  const bar = $("#load i"), label = $("#loadLabel"), btn = $("#goQ");
  bar.style.transition = "none"; bar.style.width = "0";
  btn.classList.remove("in");
  let i = 0;
  label.textContent = LOAD_STEPS[0];
  requestAnimationFrame(()=>{ bar.style.transition = ""; bar.style.width = "100%"; });
  const tick = setInterval(()=>{
    i++;
    if(i < LOAD_STEPS.length) label.textContent = LOAD_STEPS[i];
  }, 520);
  setTimeout(()=>{
    clearInterval(tick);
    label.textContent = "준비됐습니다";
    btn.classList.add("in");
  }, reduce?100:2200);
}
$("#goQ").addEventListener("click", ()=>{ renderQuestions(); go("s4"); });

/* ---------------- questions: one at a time ---------------- */
const stage4 = document.getElementById("stage4");
let steps = [], cur = 0, answers = {}, upload = null;

function buildSteps(){
  const jobName = picked.job.name.replace("\n"," ");
  const qs = Q[picked.job.id];
  steps = [];

  steps.push({kind:"upload"});

  qs.forEach((text,i)=>{
    const e = EV[i];
    steps.push({kind:"q", id:"d"+i, tag:e.tag, q:text, follow:e.follow, ev:[
      ["수치", e.val],
      ["판정 기준", e.basis],
      ["원문", `${e.src} · <a href="#" onclick="return false">DART 원문</a>`],
      ["매핑", e.map.replace("계열", jobName)]
    ]});
  });

  steps.push({kind:"q", id:"risk", tag:"회사가 직접 밝힌 위험요소",
    quote:"당사가 영위하는 바이오의약품 위탁생산 사업은 고객사와의 장기 수주 계약에 기반하므로, 생산 설비의 비가동 시간이 발생할 경우 납기 지연과 고객 신뢰 저하로 이어질 수 있습니다.",
    quoteSrc:"II. 사업의 내용 &gt; 위험요소 서술",
    q:"회사가 스스로 이렇게 썼습니다. 이 대목에 대해 뭐라고 답하시겠어요?",
    follow:"그 서술을 어디서 확인하셨나요?",
    why:"판정하지 않고 원문 그대로 옮겼습니다. 회사가 자기 입으로 쓴 문장이라 면접에서 되물리기 어렵습니다."});

  COMMON.forEach((c,i)=>{
    steps.push({kind:"q", id:"c"+i, tag:"어느 회사에나 나오는 질문", q:c.q, follow:c.f});
  });

  steps.push({kind:"sum"});
  cur = 0; answers = {}; upload = null;
}

function renderStep(){
  const st = steps[cur];
  const total = steps.length - 1;
  document.getElementById("qCount").textContent =
    st.kind === "sum" ? "다 물었습니다" : `${String(cur+1).padStart(2,"0")} / ${String(total).padStart(2,"0")}`;

  const el = document.createElement("div");
  el.className = "step";
  el.innerHTML = `<div class="body">${st.kind === "sum" ? summaryHTML() : stepHTML(st)}</div>`;

  const old = stage4.firstElementChild;
  if(old){
    old.classList.remove("in");
    setTimeout(()=>old.remove(), reduce?0:360);
  }
  stage4.appendChild(el);
  window.scrollTo({top:0, behavior: reduce ? "auto" : "smooth"});
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("in")));
  wire(el, st);
  updateBar();
}

function stepHTML(st){
  if(st.kind === "upload"){
    return `
      <p class="tag">먼저 하나만</p>
      <p class="qbig title-role">지속가능경영보고서나 CES 발표 자료가 있으면 올려주세요.</p>
      <p class="why">공시에는 숫자가 있지만 회사가 무엇을 어떻게 운영하는지는 잘 나오지 않습니다. 이 자료들이 그 부분을 채웁니다. 올린 파일은 이 화면에서만 쓰이고 저장하지 않으며, 여기서 나온 내용은 공시 수치와 섞지 않습니다.</p>
      ${upload
        ? `<p class="fname">${upload} — 읽었습니다. 마지막에 질문이 하나 더 붙습니다.<button type="button" data-act="rm">빼기</button></p>`
        : `<div class="filerow">
             <button class="pick-file" data-act="pick">파일 고르기</button>
             <button class="skip" data-act="next">없어요, 건너뛸게요</button>
           </div>`}
      <input type="file" accept=".pdf" hidden data-act="input">
      <div class="nav">
        <button class="next" data-act="next">${upload ? "다음" : "질문 시작하기"}</button>
      </div>`;
  }
  const ev = st.ev ? `<dl class="ev">${st.ev.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>` : "";
  const quote = st.quote ? `<div class="quote">${st.quote}<div class="src">${st.quoteSrc} · <a href="#" onclick="return false">DART 원문</a></div></div>` : "";
  const why = st.why ? `<p class="why">${st.why}</p>` : "";
  const last = cur === steps.length - 2;
  return `
    <p class="tag">${st.tag}</p>
    ${quote}
    <p class="qbig title-role">${st.q}</p>
    ${why}
    ${ev}
    <textarea class="ans" placeholder="여기에 답을 적어보세요. 이 답이 지원동기 초안이 됩니다." data-act="ans">${answers[st.id] || ""}</textarea>
    <p class="follow"><button type="button" data-act="fold">이어질 질문 보기</button><span class="body">${st.follow}</span></p>
    <div class="nav">
      <button class="next" data-act="next">${last ? "답변 모아보기" : "다음 질문"}</button>
      <button class="prev" data-act="prev">이전</button>
      <span class="hint">비워두고 넘어가도 됩니다</span>
    </div>`;
}

function summaryHTML(){
  const items = steps.filter(s=>s.kind === "q").map(s=>{
    const a = (answers[s.id] || "").trim();
    return `<div class="sumitem">
      <p class="sq title-role">${s.q}</p>
      <p class="sa ${a ? "" : "empty"}">${a ? a.replace(/</g,"&lt;") : "아직 답하지 않음"}</p>
    </div>`;
  }).join("");
  const done = steps.filter(s=>s.kind === "q" && (answers[s.id]||"").trim()).length;
  const all = steps.filter(s=>s.kind === "q").length;
  const notice = picked.co !== "삼성바이오로직스"
    ? `<p class="notice">프로토타입입니다. 수치는 삼성바이오로직스 공시 기준이며, 실제 서비스에서는 ${picked.co}의 공시로 채워집니다.</p>` : "";
  return `
    <p class="tag">${done} / ${all} 답함</p>
    <h2 class="sumhead title-role">여기까지가 쓸 거리입니다</h2>
    <p class="sumlead">문장으로 다듬는 건 본인 몫입니다. 직접 고른 답이어야 면접에서 왜 그렇게 썼는지 설명할 수 있습니다.</p>
    ${notice}
    ${items}
    <div class="foot">
      <button class="btn" data-act="dl">답변 내려받기</button>
      <button class="btn ghost" data-act="again">처음부터 다시 보기</button>
      <button class="btn ghost" data-go="s2">다른 회사 보기</button>
    </div>
    <div class="urlbox"><b>이 결과 주소</b>why-this-company.app/r/8f2c41ae — 저장해 두면 쓰던 답을 이어서 쓸 수 있습니다.</div>
    <div class="folds">
      <details class="fold"><summary>판정 기준</summary><div class="body">
        <p>쏠림 — 상위 1~2개 항목 비중 합이 70% 이상인 경우 (공정거래법 시장지배력 추정 기준 참조)</p>
        <p>소수 거래처 의존 — 주요 매입처가 소수로 명시된 경우 (K-IFRS 1108호 주요 고객 공시 취지 참조)</p>
        <p>급한 변화 — 전년 대비 비중이 ±10%p 이상 변동한 경우</p>
      </div></details>
      <details class="fold"><summary>출처</summary><div class="body">
        <p>사업보고서 (연결 기준, 제15기, 2024년) — 금융감독원 전자공시시스템</p>
        <p>지역 쏠림 · 급한 변화 — II. 사업의 내용 &gt; 4. 매출 및 수주상황</p>
        <p>원재료 의존 — II. 사업의 내용 &gt; 3. 원재료 및 생산설비</p>
      </div></details>
      <details class="fold"><summary>더 볼 것</summary><div class="body">
        <p>지속가능경영보고서는 자율공시라 접수번호가 다릅니다. DART에서 회사명과 함께 검색해 가동시간·품질관리 항목을 보세요.</p>
      </div></details>
    </div>
    <p class="disclaim">공시 데이터: 금융감독원 전자공시시스템(DART), 특허: KIPRIS. 재무제표는 회사가 작성하며 정정 시 수치가 바뀔 수 있습니다. 취업 준비용 참고 자료이며 투자 판단 자료가 아닙니다.</p>`;
}

function wire(el, st){
  const ta = el.querySelector("[data-act=ans]");
  if(ta){
    const grow = ()=>{ ta.style.height = "auto"; ta.style.height = Math.max(150, ta.scrollHeight) + "px"; };
    grow();
    ta.addEventListener("input", ()=>{ answers[st.id] = ta.value; grow(); updateBar(); });
    setTimeout(()=>ta.focus({preventScroll:true}), reduce?0:420);
  }
  el.querySelectorAll("[data-act]").forEach(b=>{
    const act = b.dataset.act;
    if(act === "fold") b.addEventListener("click", ()=>{
      const p = b.parentElement;
      p.classList.toggle("open");
      b.textContent = p.classList.contains("open") ? "이어질 질문 접기" : "이어질 질문 보기";
    });
    if(act === "next") b.addEventListener("click", ()=>{ if(cur < steps.length-1){ cur++; renderStep(); } });
    if(act === "prev") b.addEventListener("click", ()=>{ if(cur > 0){ cur--; renderStep(); } });
    if(act === "pick") b.addEventListener("click", ()=>el.querySelector("[data-act=input]").click());
    if(act === "input") b.addEventListener("change", ()=>{
      if(b.files[0]){ upload = b.files[0].name; addUploadStep(); renderStep(); }
    });
    if(act === "rm") b.addEventListener("click", ()=>{
      upload = null;
      steps = steps.filter(s=>s.id !== "doc");
      renderStep();
    });
    if(act === "again") b.addEventListener("click", ()=>{ cur = 0; renderStep(); });
    if(act === "dl") b.addEventListener("click", download);
  });
  el.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click", ()=>go(b.dataset.go)));
}

function addUploadStep(){
  if(steps.some(s=>s.id === "doc")) return;
  const at = steps.findIndex(s=>s.kind === "sum");
  steps.splice(at, 0, {kind:"q", id:"doc", tag:"올린 자료에서",
    q:"보고서에 적힌 제도나 시스템 중 하나를 골라, 그 이름을 지원동기에 넣는다면 어디에 쓰시겠어요?",
    follow:"그 제도를 어디서 확인하셨나요?",
    ev:[["근거","올린 자료 — 공시가 아니므로 수치는 리포트에 넣지 않습니다"],
        ["왜","일반론 대신 회사가 실제로 운영하는 제도 이름을 쓰면 문장이 이 회사에만 맞게 됩니다"]]});
}

function updateBar(){
  const qs = steps.filter(s=>s.kind === "q");
  const done = qs.filter(s=>(answers[s.id]||"").trim()).length;
  document.getElementById("bar").style.width = qs.length ? (done/qs.length*100)+"%" : "0";
}

function renderQuestions(){
  const jobName = picked.job.name.replace("\n"," ");
  document.getElementById("qMeta").innerHTML = `<b>삼성바이오로직스</b> · ${jobName}`;
  buildSteps();
  stage4.innerHTML = "";
  renderStep();
}

function download(){
  const jobName = picked.job.name.replace("\n"," ");
  let out = `삼성바이오로직스 / ${jobName} — 답해야 할 질문\n\n`;
  steps.filter(s=>s.kind === "q").forEach((s,i)=>{
    out += `${i+1}. ${s.q}\n   내 답: ${(answers[s.id]||"").trim() || "(아직 답하지 않음)"}\n   이어질 질문: ${s.follow}\n\n`;
  });
  const blob = new Blob([out], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "why-this-company_답변.txt";
  a.click();
}
</script>
</body>
</html>
